services:
  - type: web
    name: ivie-ai
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_NAME
        value: Ivie AI
      - key: LLM_PROVIDER
        value: huggingface
      - key: HF_SPACE_URL
        value: https://georgeuwaifo-ivieai.hf.space
      - key: HF_TIMEOUT
        value: "120"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: HF_TOKEN
        sync: false              # ← set its value in the Render dashboard